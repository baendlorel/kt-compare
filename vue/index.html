<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Performance Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .test-selector {
      margin-bottom: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
    }

    .test-selector button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      background: #42b983;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .test-selector button:hover {
      background: #359268;
    }

    .test-selector button.active {
      background: #2c3e50;
    }

    .metrics {
      margin: 20px 0;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 4px;
      font-family: monospace;
    }

    .metrics-item {
      margin: 5px 0;
    }

    .test-area {
      margin-top: 20px;
      min-height: 400px;
    }

    /* List styles */
    .list-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item:nth-child(even) {
      background: #fafafa;
    }

    .list-item button {
      padding: 5px 10px;
      border: none;
      background: #f44336;
      color: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Nested component styles */
    .nested-component {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    /* Control buttons */
    .controls {
      margin: 20px 0;
    }

    .controls button {
      margin-right: 10px;
      padding: 10px 20px;
      border: none;
      background: #2196F3;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #1976D2;
    }

    .controls button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/vue/main.js"></script>
</body>

</html>
